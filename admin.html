<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台</title>
    <!-- 引入 Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #222; padding: 30px; border-radius: 10px; border: 2px solid #d4af37; text-align: center; width: 280px; }
        h2 { color: #d4af37; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #333; border: 1px solid #555; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #d4af37; border: none; font-weight: bold; cursor: pointer; }
        #error { color: #ff4757; font-size: 12px; margin-top: 10px; height: 15px; }
        #panel { display: none; }
        .num { font-size: 60px; color: #00c800; margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login" class="box">
        <h2>👑 管理員登入</h2>
        <input type="password" id="pwd" placeholder="請輸入密碼">
        <button onclick="login()">登入</button>
        <div id="error"></div>
    </div>

    <div id="panel" class="box">
        <h2>👑 專屬管理後台</h2>
        <div>目前真實線上人數</div>
        <div class="num" id="count">--</div>
        <div id="status" style="font-size: 12px; color: #888;">連線中...</div>
        <button style="margin-top: 20px; background: transparent; color: #aaa; border: 1px solid #555;" onclick="location.reload()">登出</button>
    </div>

    <script>
        const pwd = 'adnim';
        const url = 'https://ncebylvmcnrrayqbwtog.supabase.co';
        const key = 'sb_publishable_Mb6kdbK9PvrrBq1PUU0IWA_FMMd7sTG';

        function login() {
            const input = document.getElementById('pwd').value;
            if (input === pwd) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                startTracking();
            } else {
                document.getElementById('error').innerText = '密碼錯誤！';
            }
        }

        function startTracking() {
            const sb = window.supabase.createClient(url, key);
            const channel = sb.channel('online-users');
            channel.on('presence', { event: 'sync' }, () => {
                const state = channel.presenceState();
                document.getElementById('count').innerText = Object.keys(state).length;
                document.getElementById('status').innerText = '最後更新：' + new Date().toLocaleTimeString();
            });
            channel.subscribe();
        }
    </script>
</body>
</html>
