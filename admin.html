<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台 - 數據分析</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #111; color: #fff; font-family: 'Microsoft JhengHei', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }

        #login-screen { background: #222; padding: 40px; border-radius: 15px; border: 2px solid #d4af37; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 320px; }
        #login-screen h2 { color: #d4af37; margin-top: 0; }
        #login-screen input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #555; border-radius: 5px; background: #333; color: #fff; font-size: 15px; }
        #login-screen button { width: 100%; padding: 12px; background: #d4af37; color: #000; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        #login-screen button:hover { background: #fcf6ba; }
        .error-msg { color: #ff4757; font-size: 13px; height: 20px; margin-top: 10px; }

        #admin-panel { display: none; width: 100%; max-width: 1200px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .box { background: #222; padding: 30px; border-radius: 15px; border: 2px solid #d4af37; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; }
        .box h1 { color: #d4af37; margin-top: 0; font-size: 20px; }
        .number { font-size: 70px; font-weight: bold; color: #00c800; margin: 10px 0; text-shadow: 0 0 20px rgba(0, 200, 0, 0.5); }
        .status { font-size: 13px; color: #888; }

        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-box { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .chart-box h3 { color: #d4af37; margin-top: 0; font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; text-align: center;}
        .canvas-wrapper { position: relative; height: 250px; width: 100%; }

        .panel-section { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; text-align: left; }
        .panel-section h2 { color: #d4af37; font-size: 18px; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; background: #1a1a1a; padding: 15px; border-radius: 8px; }
        .toolbar input { padding: 8px 12px; border-radius: 5px; border: 1px solid #555; background: #333; color: #fff; font-size: 13px; }
        .toolbar button { padding: 8px 15px; background: #d4af37; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }

        .order-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .order-table th, .order-table td { padding: 10px; border-bottom: 1px solid #333; text-align: left; }
        .order-table th { color: #d4af37; background: #1a1a1a; }
        .order-table tr:hover { background: rgba(212, 175, 55, 0.05); }

        .btn-group { display: flex; gap: 5px; align-items: center; }
        .status-btn { padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; white-space: nowrap;}
        .status-pending { background: #ffc107; color: #000; }
        .status-shipped { background: #00c800; color: #fff; }
        .action-btn { padding: 6px 10px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; transition: 0.3s; color:#fff; }
        .copy-btn { background: #00bcd4; }
        .print-btn { background: #9c27b0; }
        .del-btn { background: #ff4757; }

        .logout-btn { padding: 8px 20px; background: transparent; color: #888; border: 1px solid #888; border-radius: 5px; cursor: pointer; font-size: 13px; margin-top: 10px; transition: 0.3s; }

        /* ===== 獨立客服對話樣式 ===== */
        .admin-chat-container { display: flex; gap: 20px; height: 460px; }
        .admin-chat-list { width: 34%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .admin-chat-list li { padding: 12px 15px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; }
        .admin-chat-list li:hover { background: rgba(212,175,55,0.1); }
        .admin-chat-list li.active { background: rgba(212,175,55,0.2); border-left: 3px solid #d4af37; }
        .admin-chat-list .info { flex: 1; overflow: hidden; }
        .admin-chat-list .name { color: #d4af37; font-weight: bold; word-break: break-all; font-size: 13px; }
        .admin-chat-list .preview { font-size: 12px; color: #888; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-chat-list .del-btn { background: none; border: none; color: #666; cursor: pointer; padding: 0 5px; font-size: 16px; }
        .admin-chat-list .del-btn:hover { color: #ff4757; }

        .admin-chat-window { flex: 1; display: flex; flex-direction: column; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; }
        .admin-chat-header { padding: 12px 15px; background: #222; border-bottom: 1px solid #333; border-radius: 8px 8px 0 0; color: #888; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .admin-chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .admin-chat-input { padding: 10px; border-top: 1px solid #333; display: flex; gap: 10px; align-items: center; }
        .admin-chat-input input[type="text"] { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; outline: none; }
        .admin-chat-input button { padding: 10px 20px; background: #d4af37; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .upload-label { background: #444; color: #fff; width: 38px; height: 38px; border-radius: 5px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 18px; }
        #adminImageUpload { display: none; }

        .chat-msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .chat-msg.admin { align-self: flex-end; background: #d4af37; color: #000; }
        .chat-msg.user { align-self: flex-start; background: #333; color: #fff; }
        .chat-msg.system { align-self: center; background: rgba(212,175,55,0.15); border: 1px solid #d4af37; color: #d4af37; text-align: center; max-width: 95%; }
        .chat-msg img { max-width: 100%; border-radius: 5px; margin-top: 5px; cursor: pointer; }
        .chat-msg-time { font-size: 10px; color: rgba(0,0,0,0.5); margin-top: 3px; }
        .chat-msg.user .chat-msg-time, .chat-msg.system .chat-msg-time { color: #888; }
        .chat-empty { color: #666; text-align: center; margin-top: 50px; }

        @media (max-width: 900px) { .charts-container { grid-template-columns: 1fr; } .admin-chat-container { flex-direction: column; height: auto; } .admin-chat-list { width: 100%; height: 200px; } .admin-chat-window { height: 350px; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>👑 管理員登入</h2>
        <input type="email" id="email-input" placeholder="請輸入管理員 Email">
        <input type="password" id="password-input" placeholder="請輸入密碼">
        <button id="login-btn" onclick="handleLogin()">登入系統</button>
        <div class="error-msg" id="error-msg"></div>
    </div>

    <div id="admin-panel">
        <div class="dashboard">
            <div class="box">
                <h1>📊 目前線上人數</h1>
                <div class="number" id="online-count">--</div>
                <div class="status" id="status-text">等待連線...</div>
            </div>
            <div class="box">
                <h1>👁️ 累計總瀏覽量</h1>
                <div class="number" id="view-count" style="color: #00bcd4;">--</div>
            </div>
            <div class="box">
                <h1>💰 區間總營業額</h1>
                <div class="number" id="revenue" style="color: #d4af37; font-size: 50px;">$ 0</div>
                <div class="status" id="order-count-text">目前顯示 0 筆訂單</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <h3>🏆 熱門商品 TOP 5 (點擊數)</h3>
                <div class="canvas-wrapper"><canvas id="topProductsChart"></canvas></div>
            </div>
            <div class="chart-box">
                <h3>📊 各品牌預約佔比</h3>
                <div class="canvas-wrapper"><canvas id="brandPieChart"></canvas></div>
            </div>
        </div>

        <div class="panel-section">
            <h2>💬 即時客服對話（每位訪客獨立）</h2>
            <div class="admin-chat-container">
                <ul class="admin-chat-list" id="admin-chat-list">
                    <li style="color: #666; text-align: center; cursor: default;">尚無對話</li>
                </ul>
                <div class="admin-chat-window">
                    <div class="admin-chat-header">
                        <span id="admin-chat-header">請從左側選擇一位訪客</span>
                    </div>
                    <div class="admin-chat-body" id="admin-chat-body">
                        <div class="chat-empty">尚未選擇對話</div>
                    </div>
                    <div class="admin-chat-input">
                        <label class="upload-label">📷<input type="file" id="adminImageUpload" accept="image/*" onchange="uploadAdminImage(this)"></label>
                        <input type="text" id="admin-chat-input" placeholder="請先選擇左側訪客..." disabled onkeypress="if(event.key === 'Enter') sendAdminReply()">
                        <button id="admin-chat-send-btn" onclick="sendAdminReply()" disabled>送出</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <h2>📋 訂單管理</h2>
            <div class="toolbar">
                <input type="text" id="search-input" placeholder="🔍 搜尋姓名或電話...">
                <button onclick="loadOrders()">查詢</button>
                <button onclick="resetFilter()" style="background:transparent; border:1px solid #d4af37; color:#d4af37;">重置</button>
                <div style="margin-left: auto;">
                    <button style="background: #00c800; color: #fff;" onclick="exportCSV()">📥 匯出報表</button>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table class="order-table" id="order-table">
                    <thead>
                        <tr><th>時間</th><th>商品</th><th>姓名</th><th>電話</th><th>地址</th><th>操作</th></tr>
                    </thead>
                    <tbody id="order-list">
                        <tr><td colspan="6" style="text-align:center; color:#666;">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div style="text-align: center;">
            <button class="logout-btn" onclick="logout()">登出系統</button>
        </div>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://ncebylvmcnrrayqbwtog.supabase.co', 'sb_publishable_Mb6kdbK9PvrrBq1PUU0IWA_FMMd7sTG');

        let currentChatSession = null;
        let allChatSessions = {};
        let renderedMsgIds = new Set();
        let topProductsChartInstance = null;
        let brandPieChartInstance = null;
        let currentOrdersData = [];
        let pollTimer = null;

        window.onload = async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) showAdminPanel(session.user.email);
        };

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLogin();
        });

        async function handleLogin() {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('error-msg');

            if (!email || !password) { errorMsg.innerText = '請填寫 Email 與密碼'; return; }
            btn.innerText = '登入中...'; btn.disabled = true; errorMsg.innerText = '';

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.innerText = '登入失敗：' + error.message;
                btn.innerText = '登入系統'; btn.disabled = false;
            } else {
                showAdminPanel(data.user.email);
            }
        }

        async function showAdminPanel(email) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            document.title = `後台 - ${email}`;

            loadOrders();
            loadViewCount();
            await refreshSessions();
            initRealtime();
            startPolling();
        }

        async function loadViewCount() {
            const { data } = await supabase.from('site_stats').select('view_count').eq('id', 1).single();
            if (data) document.getElementById('view-count').innerText = data.view_count || 0;
        }

        async function loadOrders() {
            const tbody = document.getElementById('order-list');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#666;">載入中...</td></tr>';
            const searchText = document.getElementById('search-input').value.trim();

            try {
                let query = supabase.from('orders').select('*').order('created_at', { ascending: false });
                if (searchText) query = query.or(`customer_name.ilike.%${searchText}%,customer_phone.ilike.%${searchText}%`);
                
                const { data, error } = await query.limit(200);
                if (error) throw error;

                currentOrdersData = data;
                document.getElementById('order-count-text').innerText = `目前顯示 ${data.length} 筆訂單`;
                document.getElementById('revenue').innerText = `$ ${(data.length * 3000).toLocaleString()}`;

                updateCharts(data);

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#666;">查無符合條件的訂單</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(order => {
                    const tr = document.createElement('tr');
                    const time = order.created_at ? new Date(order.created_at).toLocaleString('zh-TW', { hour12: false }) : '-';
                    tr.innerHTML = `
                        <td>${time}</td>
                        <td>${order.product_name || '-'}</td>
                        <td>${order.customer_name || '-'}</td>
                        <td style="color: #00c800; font-weight: bold;">${order.customer_phone || '-'}</td>
                        <td>${order.customer_address || '-'}</td>
                        <td>
                            <div class="btn-group">
                                <button class="action-btn copy-btn" onclick="copyInfo('${order.customer_name}', '${order.customer_phone}', '${order.customer_address}', '${order.product_name}')">📋</button>
                                <button class="action-btn del-btn" onclick="deleteOrder(${order.id}, '${order.customer_name}')">🗑️</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#ff4757;">載入失敗：${err.message}</td></tr>`;
            }
        }

        function resetFilter() {
            document.getElementById('search-input').value = '';
            loadOrders();
        }

        function copyInfo(name, phone, address, product) {
            navigator.clipboard.writeText(`收件人：${name}\n電話：${phone}\n地址：${address}\n商品：${product}`).then(() => alert('✅ 已複製收件資訊！'));
        }

        async function deleteOrder(id, name) {
            if (!confirm(`⚠️ 確定要刪除「${name}」的訂單嗎？`)) return;
            await supabase.from('orders').delete().eq('id', id);
            loadOrders();
        }

        function exportCSV() {
            if (currentOrdersData.length === 0) return alert('沒有資料可以匯出！');
            let csvContent = "\uFEFF下單時間,商品名稱,收件人,電話,地址\n";
            currentOrdersData.forEach(o => {
                const time = new Date(o.created_at).toLocaleString('zh-TW', { hour12: false });
                csvContent += `"${time}","${o.product_name || ''}","${o.customer_name || ''}","${o.customer_phone || ''}","${o.customer_address || ''}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `訂單報表_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        async function updateCharts(ordersData) {
            try {
                const { data: clicksData } = await supabase.from('product_clicks').select('product_name, click_count').order('click_count', { ascending: false }).limit(5);
                if (topProductsChartInstance) topProductsChartInstance.destroy();
                const ctxProd = document.getElementById('topProductsChart').getContext('2d');
                topProductsChartInstance = new Chart(ctxProd, {
                    type: 'bar',
                    data: {
                        labels: clicksData && clicksData.length > 0 ? clicksData.map(d => d.product_name) : ['暫無數據'],
                        datasets: [{ label: '點擊次數', data: clicksData && clicksData.length > 0 ? clicksData.map(d => d.click_count) : [0], backgroundColor: '#d4af37', borderRadius: 5 }]
                    },
                    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            } catch (e) {}

            const brandCounts = { '勞力士': 0, '歐米茄': 0, '愛彼': 0, '沛納海': 0, '百達翡麗': 0, '其他': 0 };
            ordersData.forEach(o => {
                if (!o.product_name) return;
                if (o.product_name.includes('勞力士')) brandCounts['勞力士']++;
                else if (o.product_name.includes('歐米茄')) brandCounts['歐米茄']++;
                else if (o.product_name.includes('愛彼')) brandCounts['愛彼']++;
                else if (o.product_name.includes('沛納海')) brandCounts['沛納海']++;
                else if (o.product_name.includes('百達翡麗')) brandCounts['百達翡麗']++;
                else brandCounts['其他']++;
            });

            const filteredBrands = Object.entries(brandCounts).filter(b => b[1] > 0);
            if (brandPieChartInstance) brandPieChartInstance.destroy();
            const ctxBrand = document.getElementById('brandPieChart').getContext('2d');
            brandPieChartInstance = new Chart(ctxBrand, {
                type: 'doughnut',
                data: {
                    labels: filteredBrands.map(b => b[0]),
                    datasets: [{ data: filteredBrands.map(b => b[1]), backgroundColor: ['#d4af37', '#00c800', '#00bcd4', '#ff4757', '#9c27b0', '#ffc107'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#ccc' } } } }
            });
        }

        // ====== 後台客服邏輯 ======
        async function refreshSessions() {
            const { data, error } = await supabase.from('chat_messages').select('*').order('created_at', { ascending: true });
            if (error) return;

            const grouped = {};
            data.forEach(msg => {
                if (!grouped[msg.session_id]) grouped[msg.session_id] = { msgs: [], last: '', time: new Date(0) };
                grouped[msg.session_id].msgs.push(msg);
                grouped[msg.session_id].last = msg.message;
                grouped[msg.session_id].time = new Date(msg.created_at);
            });

            allChatSessions = grouped;
            renderSessionList();
            if (currentChatSession && allChatSessions[currentChatSession]) renderChat();
        }

        function renderSessionList() {
            const list = document.getElementById('admin-chat-list');
            const sids = Object.keys(allChatSessions);
            if (sids.length === 0) {
                list.innerHTML = '<li style="color:#666; text-align:center; cursor:default;">尚無對話</li>';
                return;
            }

            sids.sort((a, b) => allChatSessions[b].time - allChatSessions[a].time);
            list.innerHTML = '';
            
            sids.forEach(sid => {
                const s = allChatSessions[sid];
                const li = document.createElement('li');
                li.className = sid === currentChatSession ? 'active' : '';
                const isOrder = s.last.includes('📦 【新訂單通知】');
                const preview = isOrder ? '📦 [新訂單]' : (s.last.startsWith('http') ? '📷 [圖片]' : s.last);

                li.innerHTML = `
                    <div class="info">
                        <div class="name">👤 ${sid}</div>
                        <div class="preview" style="${isOrder ? 'color:#ffc107; font-weight:bold;' : ''}">${preview}</div>
                    </div>
                    <button class="del-btn" onclick="deleteSession(event, '${sid}')">🗑️</button>
                `;
                li.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') selectSession(sid);
                };
                list.appendChild(li);
            });
        }

        function selectSession(sid) {
            currentChatSession = sid;
            document.getElementById('admin-chat-header').innerText = `正在與 ${sid} 對話`;
            document.getElementById('admin-chat-input').disabled = false;
            document.getElementById('admin-chat-send-btn').disabled = false;
            renderChat();
        }

        function renderChat() {
            const body = document.getElementById('admin-chat-body');
            const msgs = allChatSessions[currentChatSession].msgs;
            body.innerHTML = '';
            renderedMsgIds.clear();
            
            msgs.forEach(msg => {
                if (!renderedMsgIds.has(msg.id)) {
                    appendMsg(msg.message, msg.sender, msg.created_at);
                    renderedMsgIds.add(msg.id);
                }
            });
            body.scrollTop = body.scrollHeight;
        }

        function appendMsg(text, sender, time) {
            const body = document.getElementById('admin-chat-body');
            const div = document.createElement('div');
            div.className = `chat-msg ${sender}`;
            const timeStr = time ? new Date(time).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) : '';

            if (text.includes('📦 【新訂單通知】')) {
                div.className = 'chat-msg system';
                div.innerHTML = `${text.replace(/\n/g, '<br>')}<div class="chat-msg-time">${timeStr}</div>`;
            } else if (text.startsWith('http') && (text.includes('chat-images') || text.match(/\.(jpeg|jpg|png|webp)/i))) {
                div.innerHTML = `<img src="${text}" onclick="window.open('${text}')"><div class="chat-msg-time">${timeStr}</div>`;
            } else {
                div.innerHTML = `${text.replace(/\n/g, '<br>')}<div class="chat-msg-time">${timeStr}</div>`;
            }
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
        }

        async function sendAdminReply() {
            if (!currentChatSession) return alert('請先選擇訪客');
            const input = document.getElementById('admin-chat-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            await supabase.from('chat_messages').insert([{ session_id: currentChatSession, sender: 'admin', message: text }]);
            refreshSessions();
        }

        async function uploadAdminImage(input) {
            if (!currentChatSession) return alert('請先選擇訪客');
            if (!input.files || input.files.length === 0) return;
            const file = input.files[0];
            const fileName = `admin_${currentChatSession}_${Date.now()}.${file.name.split('.').pop()}`;
            
            const { error } = await supabase.storage.from('chat-images').upload(fileName, file);
            if (error) return alert('上傳失敗：' + error.message);
            
            const { data: { publicUrl } } = supabase.storage.from('chat-images').getPublicUrl(fileName);
            await supabase.from('chat_messages').insert([{ session_id: currentChatSession, sender: 'admin', message: publicUrl }]);
            input.value = '';
            refreshSessions();
        }

        async function deleteSession(event, sid) {
            event.stopPropagation();
            if (!confirm(`確定清除 ${sid} 的所有對話？`)) return;
            
            await supabase.from('chat_messages').delete().eq('session_id', sid);
            if (currentChatSession === sid) {
                currentChatSession = null;
                document.getElementById('admin-chat-body').innerHTML = '<div class="chat-empty">尚未選擇對話</div>';
                document.getElementById('admin-chat-header').innerText = '請從左側選擇一位訪客';
                document.getElementById('admin-chat-input').disabled = true;
                document.getElementById('admin-chat-send-btn').disabled = true;
            }
            refreshSessions();
        }

        function initRealtime() {
            supabase.channel('admin-chat-all')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, () => { refreshSessions(); })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => { loadOrders(); })
                .subscribe();
        }

        function startPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(refreshSessions, 3000);
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
