<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尊享腕錶 後台管理</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--gold:#d4af37;--bg:#0f0f10;--panel:#18181b;--panel2:#202024;--line:#2a2a30;--text:#e8e8ea;--muted:#8b8b93;--green:#06c755;--red:#ff4757;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:var(--gold);text-decoration:none}
.muted{color:var(--muted);font-size:12.5px}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#1c1c22 0%,#0f0f10 60%);padding:20px}
.login-card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 28px;text-align:center}
.login-logo{font-size:22px;font-weight:700;letter-spacing:2px}
.login-logo span{display:block;font-size:9px;letter-spacing:5px;color:var(--gold);font-weight:500}
.login-card h2{font-size:15px;font-weight:500;color:var(--muted);margin:22px 0 18px}
.login-card input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:#111114;color:var(--text);font-size:14px;outline:none}
.login-card input:focus{border-color:var(--gold)}
.login-card button{width:100%;padding:13px;border-radius:10px;background:var(--gold);color:#000;font-weight:700;font-size:15px;margin-top:6px}
.login-card button:disabled{opacity:.6}
.login-error{color:var(--red);font-size:12.5px;min-height:18px;margin-top:10px}
/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:210px;flex:0 0 210px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-logo{padding:20px 18px;font-size:17px;font-weight:700;letter-spacing:2px;border-bottom:1px solid var(--line)}
.sb-logo span{display:block;font-size:8px;letter-spacing:4px;color:var(--gold);font-weight:500}
.sidebar nav{padding:12px 8px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav-btn{text-align:left;padding:11px 14px;border-radius:10px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-btn:hover{background:var(--panel2);color:var(--text)}
.nav-btn.active{background:rgba(212,175,55,.14);color:var(--gold);font-weight:600}
.nav-badge{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.sb-foot{padding:14px;border-top:1px solid var(--line);font-size:12px}
.sb-email{display:block;color:var(--muted);margin-bottom:8px;word-break:break-all}
.sb-logout{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);font-size:12.5px}
.sb-logout:hover{border-color:var(--red);color:var(--red)}
.main{flex:1;min-width:0;padding:22px 24px 40px}
.tab{display:none}.tab.active{display:block}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:21px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid transparent}
.btn.gold{background:var(--gold);color:#000}
.btn.ghost{border-color:var(--line);color:var(--text);background:var(--panel)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:6px 11px;font-size:12px}
/* filters + table */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=text]{flex:1;min-width:180px;max-width:340px;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none}
.filters input[type=text]:focus{border-color:var(--gold)}
.filters select,.head-actions select{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none;font-size:13px}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
thead th{text-align:left;padding:11px 12px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
.t-thumb{width:44px;height:44px;object-fit:cover;border-radius:7px;background:#26262b}
.t-name{font-weight:600;max-width:220px}
.t-sub{font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px}
.pill.on{background:rgba(6,199,85,.16);color:var(--green)}
.pill.off{background:rgba(255,71,87,.14);color:var(--red)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.icon-act{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.icon-act:hover{border-color:var(--gold);background:rgba(212,175,55,.1)}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);font-size:13px;padding:0 10px}
.pager button.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.pager span{color:var(--muted);font-size:12.5px}
/* modal + form */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;opacity:0;visibility:hidden;transition:.25s}
.overlay.active{opacity:1;visibility:visible}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(620px,94vw);max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;z-index:600;opacity:0;visibility:hidden;transition:.25s}
.modal.active{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.modal-head h3{font-size:16px}
.modal-close{font-size:24px;color:var(--muted);line-height:1}
.modal-body{padding:18px 20px}
.modal-foot{padding:0 20px 20px;display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#cfcfd4}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:#111114;color:var(--text);font-size:13.5px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:80px}
.field-row{display:flex;gap:12px;flex-wrap:wrap}
.field-row .field{flex:1;min-width:140px}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.img-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.img-item{position:relative;width:74px;height:74px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.img-item img{width:100%;height:100%;object-fit:cover}
.img-item button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.img-add{width:74px;height:74px;border-radius:9px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)}
.img-add:hover{border-color:var(--gold);color:var(--gold)}
/* chat */
.chat-tab.active{display:flex;gap:16px;height:calc(100vh - 92px)}
.chat-list{width:280px;flex:0 0 280px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.chat-list-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-list-head h2{font-size:14px}
.chat-sessions{flex:1;overflow-y:auto}
.session-item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.session-item:hover{background:var(--panel2)}
.session-item.active{background:rgba(212,175,55,.14);border-left:3px solid var(--gold)}
.session-name{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.session-time{font-size:10.5px;color:var(--muted);font-weight:400;flex:0 0 auto}
.session-last{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-unread{background:var(--red);color:#fff;font-size:10.5px;border-radius:9px;padding:1px 6px;margin-left:6px}
.chat-main{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.admin-chat-header{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
.admin-chat-header .muted{font-weight:400}
.admin-chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#141417}
.chat-empty{color:#666;text-align:center;margin-top:60px;font-size:13px}
.chat-msg{max-width:74%;padding:10px 13px;border-radius:10px;font-size:13.5px;line-height:1.5;word-break:break-word}
.chat-msg.user{align-self:flex-start;background:#2a2a31;color:#eee}
.chat-msg.admin{align-self:flex-end;background:var(--gold);color:#000}
.chat-msg-time{font-size:10px;opacity:.65;margin-top:4px;text-align:right}
.admin-chat-body .chat-img{max-width:200px;max-height:200px;border-radius:8px;display:block;cursor:zoom-in;border:1px solid rgba(255,255,255,.15)}
.chat-msg.admin .chat-img{margin-left:auto}
.admin-chat-body .chat-video{max-width:220px;border-radius:8px;display:block;background:#000}
.admin-chat-input-area{display:flex;gap:8px;align-items:center;padding:11px;border-top:1px solid var(--line);background:var(--panel)}
.admin-chat-input-area input[type=text]{flex:1;min-width:0;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:#111114;color:var(--text);outline:none;font-size:13.5px}
.admin-chat-input-area input[type=text]:focus{border-color:var(--gold)}
.admin-chat-input-area input[type=text]:disabled{color:#555}
.admin-chat-input-area button{padding:10px 18px;background:var(--gold);color:#000;border-radius:20px;font-weight:700;font-size:13px}
.admin-chat-input-area button:disabled{background:#2a2a30;color:#666;cursor:not-allowed}
.admin-chat-img-btn{padding:0!important;width:38px;height:38px;border-radius:50%!important;background:#2a2a30!important;color:var(--gold)!important;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.admin-chat-img-btn:disabled{background:#1c1c20!important;color:#444!important;cursor:not-allowed}
/* lightbox + toast */
.image-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99999;display:flex;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:.25s}
.image-lightbox.active{opacity:1;visibility:visible}
.image-lightbox img{max-width:92%;max-height:92%;border-radius:8px;object-fit:contain}
.image-lightbox .close-icon{position:absolute;top:16px;right:26px;color:#fff;font-size:40px;line-height:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:rgba(40,40,46,.98);color:#fff;border:1px solid var(--line);padding:11px 20px;border-radius:24px;font-size:13px;z-index:99998;opacity:0;visibility:hidden;transition:.25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.toast.err{border-color:rgba(255,71,87,.6);color:#ffb3b9}
@media(max-width:900px){
 .sidebar{width:64px;flex:0 0 64px}
 .sb-logo{font-size:0;padding:16px 8px;text-align:center}
 .sb-logo::before{content:"尊";font-size:18px}
 .nav-btn{justify-content:center;padding:12px 0;font-size:16px}
 .nav-btn span:not(.nav-badge){display:none}
 .sb-foot{display:none}
 .main{padding:16px 12px 30px}
 .chat-tab.active{flex-direction:column;height:auto}
 .chat-list{width:100%;flex:0 0 auto;max-height:200px}
 .chat-main{height:calc(100vh - 300px);min-height:380px}
}
</style>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">尊享腕錶<span>ADMIN</span></div>
    <h2>請登入管理後台</h2>
    <input type="email" id="loginEmail" placeholder="管理員 Email" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="密碼" autocomplete="current-password" onkeypress="if(event.key==='Enter')doLogin()">
    <button id="loginBtn" onclick="doLogin()">登入</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="sb-logo">尊享腕錶<span>ADMIN</span></div>
    <nav>
      <button class="nav-btn active" data-tab="products" onclick="switchTab('products')">📦 <span>商品管理</span></button>
      <button class="nav-btn" data-tab="orders" onclick="switchTab('orders')">🧾 <span>訂單管理</span></button>
      <button class="nav-btn" data-tab="chat" onclick="switchTab('chat')">💬 <span>客服聊天</span><span class="nav-badge" id="chatNavBadge" style="display:none">0</span></button>
    </nav>
    <div class="sb-foot">
      <span class="sb-email" id="adminEmail"></span>
      <button class="sb-logout" onclick="doLogout()">登出</button>
    </div>
  </aside>

  <main class="main">
    <section class="tab active" id="tab-products">
      <div class="page-head">
        <h1>商品管理</h1>
        <div class="head-actions">
          <button class="btn ghost" onclick="openCsvModal()">📄 CSV 匯入</button>
          <button class="btn gold" onclick="openProductModal()">＋ 新增商品</button>
        </div>
      </div>
      <div class="filters">
        <input type="text" id="prodSearch" placeholder="搜尋名稱 / 品牌" oninput="onAdminSearch()">
        <select id="prodCat" onchange="loadAdminProducts(true)"><option value="">全部分類</option></select>
        <select id="prodStatus" onchange="loadAdminProducts(true)">
          <option value="">全部狀態</option><option value="1">上架中</option><option value="0">已下架</option>
        </select>
        <span class="muted" id="prodInfo"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:60px">圖</th><th>名稱</th><th>分類</th><th>品牌</th>
            <th>價格</th><th>庫存</th><th>狀態</th><th style="width:210px">操作</th>
          </tr></thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </div>
      <div class="pager" id="prodPager"></div>
    </section>

    <section class="tab" id="tab-orders">
      <div class="page-head">
        <h1>訂單管理</h1>
        <div class="head-actions">
          <select id="orderStatusFilter" onchange="loadOrders()">
            <option value="">全部狀態</option><option value="pending">待處理</option>
            <option value="confirmed">已確認</option><option value="shipped">已出貨</option>
            <option value="done">已完成</option><option value="cancelled">已取消</option>
          </select>
          <button class="btn ghost" onclick="loadOrders()">↻ 重新整理</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:120px">時間</th><th>客戶</th><th>電話</th><th>商品</th>
            <th>金額</th><th style="width:110px">狀態</th><th style="width:200px">操作</th>
          </tr></thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="tab chat-tab" id="tab-chat">
      <aside class="chat-list">
        <div class="chat-list-head">
          <h2>對話列表</h2>
          <button class="btn ghost sm" onclick="refreshChatSessionList()">↻</button>
        </div>
        <div class="chat-sessions" id="chatSessionList"></div>
      </aside>
      <div class="chat-main">
        <div class="admin-chat-header">
          <div id="admin-chat-header">尚未選擇對話</div>
          <span class="muted" id="admin-chat-session-label"></span>
        </div>
        <div class="admin-chat-body" id="admin-chat-body">
          <div class="chat-empty">尚未選擇對話</div>
        </div>
        <div class="admin-chat-input-area">
          <input type="file" id="admin-chat-file" accept="image/*" hidden onchange="handleAdminChatImage(this)">
          <button class="admin-chat-img-btn" id="admin-chat-img-btn" disabled onclick="document.getElementById('admin-chat-file').click()" title="傳送圖片">📷</button>
          <input type="text" id="admin-chat-input" placeholder="請先選擇左側訪客..." disabled onkeypress="if(event.key==='Enter'){event.preventDefault();sendAdminReply();}">
          <button id="admin-chat-send-btn" onclick="sendAdminReply()" disabled>送出</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="productOverlay" onclick="closeProductModal()"></div>
<div class="modal" id="productModal">
  <div class="modal-head">
    <h3 id="productModalTitle">新增商品</h3>
    <button class="modal-close" onclick="closeProductModal()">&times;</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="pId">
    <div class="field"><label>商品名稱 *</label><input type="text" id="pName" maxlength="120"></div>
    <div class="field"><label>商品描述</label><textarea id="pDesc" maxlength="2000"></textarea></div>
    <div class="field-row">
      <div class="field"><label>分類</label><input type="text" id="pCategory" list="catList" maxlength="60"><datalist id="catList"></datalist></div>
      <div class="field"><label>品牌</label><input type="text" id="pBrand" maxlength="60"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>價格起（基礎）</label><input type="number" id="pBase" min="0" value="0"></div>
      <div class="field"><label>價格中（高端）</label><input type="number" id="pMid" min="0" value="0"></div>
      <div class="field"><label>價格高（定制）</label><input type="number" id="pCustom" min="0" value="0"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>庫存</label><input type="number" id="pStock" min="0" value="10"></div>
      <div class="field"><label>排序（越小越前）</label><input type="number" id="pSort" value="0"></div>
      <div class="field"><label>上架狀態</label><select id="pActive"><option value="1">上架中</option><option value="0">已下架</option></select></div>
    </div>
    <div class="field">
      <label>商品圖片</label>
      <div class="img-grid" id="pImages"></div>
      <input type="file" id="pFileInput" accept="image/*" multiple hidden onchange="onPickProductImages(this)">
      <button class="btn ghost sm" onclick="document.getElementById('pFileInput').click()">📤 上傳圖片</button>
      <div class="hint">第一張為封面圖，單張小於 5MB。</div>
    </div>
    <div class="field">
      <label>多語名稱（選填，JSON）</label>
      <textarea id="pNameI18n" style="min-height:60px" placeholder='{"en":"Submariner","ja":"サブマリーナ"}'></textarea>
    </div>
    <div class="field">
      <label>多語描述（選填，JSON）</label>
      <textarea id="pDescI18n" style="min-height:60px" placeholder='{"en":"Stainless steel, automatic."}'></textarea>
      <div class="hint">留空即沿用中文。</div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn ghost" onclick="closeProductModal()">取消</button>
    <button class="btn gold" id="saveProductBtn" onclick="saveProduct()">儲存</button>
  </div>
</div>

<div class="overlay" id="csvOverlay" onclick="closeCsvModal()"></div>
<div class="modal" id="csvModal">
  <div class="modal-head">
    <h3>CSV 大量匯入</h3>
    <button class="modal-close" onclick="closeCsvModal()">&times;</button>
  </div>
  <div class="modal-body">
    <div class="hint" style="margin-bottom:10px">名稱,描述,分類,價格起,價格迄,圖片網址(多個用 | 分隔),庫存<br>第一列可為標題列，會自動略過；每 100 筆分批寫入。</div>
    <div class="field"><label>貼上 CSV</label><textarea id="csvText" style="min-height:160px" placeholder="名稱,描述,分類,價格起,價格迄,圖片網址,庫存"></textarea></div>
    <div class="field"><label>或選擇檔案</label><input type="file" id="csvFile" accept=".csv,text/csv" onchange="onPickCsvFile(this)"></div>
    <p class="hint" id="csvResult"></p>
  </div>
  <div class="modal-foot">
    <button class="btn ghost" onclick="closeCsvModal()">取消</button>
    <button class="btn gold" id="csvImportBtn" onclick="importCsv()">開始匯入</button>
  </div>
</div>

<div class="image-lightbox" id="imageLightbox" onclick="closeImageLightbox()">
  <span class="close-icon" onclick="closeImageLightbox()">&times;</span>
  <img src="" id="lightboxImg" onclick="event.stopPropagation()" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 0. 設定 ============ */
var SUPABASE_URL = 'https://ncebylvmcnrrayqbwtog.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_Mb6kdbK9PvrrBq1PUU0IWA_FMMd7sTG';
var PAGE_SIZE = 50;
var BUCKET_PRODUCTS = 'products';
var BUCKET_CHAT = 'chat-images';

var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var $ = function (id) { return document.getElementById(id); };

/* ============ 1. 狀態 ============ */
var st = {
  tab: 'products',
  prod: { page: 0, total: 0, keyword: '', cat: '', status: '', rows: [] },
  orders: [],
  orderSessionMap: {},
  cats: []
};
var currentChatSession = null;
var allChatSessions = {};
var chatChannel = null;
var editingImages = [];

/* ============ 2. 工具 ============ */
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
function money(v) { return '$' + num(v).toLocaleString('en-US'); }
function pad2(n) { return n < 10 ? '0' + n : String(n); }
function fmtTime(d) {
  if (!d) return '';
  var t = new Date(d);
  return pad2(t.getHours()) + ':' + pad2(t.getMinutes());
}
function fmtDateTime(d) {
  if (!d) return '';
  var t = new Date(d);
  return pad2(t.getMonth() + 1) + '/' + pad2(t.getDate()) + ' ' + pad2(t.getHours()) + ':' + pad2(t.getMinutes());
}
function toast(msg, isErr) {
  var el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.className = 'toast'; }, 2600);
}
function parseImages(p) {
  var imgs = p.images;
  if (typeof imgs === 'string') { try { imgs = JSON.parse(imgs); } catch (e) { imgs = [imgs]; } }
  return Array.isArray(imgs) ? imgs.filter(Boolean) : [];
}
function firstImage(p) { var a = parseImages(p); return a.length ? a[0] : ''; }
function openModal(id) {
  var m = $(id); if (m) m.classList.add('active');
  var ov = $(id.replace('Modal', 'Overlay')); if (ov) ov.classList.add('active');
}
function closeModal(id) {
  var m = $(id); if (m) m.classList.remove('active');
  var ov = $(id.replace('Modal', 'Overlay')); if (ov) ov.classList.remove('active');
}

/* ============ 3. 登入 ============ */
function showLogin() {
  $('loginScreen').style.display = 'flex';
  $('app').style.display = 'none';
  $('loginPassword').value = '';
}
function showApp(user) {
  $('loginScreen').style.display = 'none';
  $('app').style.display = 'flex';
  $('adminEmail').textContent = user ? user.email : '';
  loadCategories();
  loadAdminProducts(true);
  loadOrders();
  initChatRealtime();
}
function doLogin() {
  var email = $('loginEmail').value.trim();
  var pwd = $('loginPassword').value;
  var errEl = $('loginError');
  var btn = $('loginBtn');

  if (!email || !pwd) { errEl.textContent = '請輸入 Email 與密碼'; return; }

  btn.disabled = true; btn.textContent = '登入中...'; errEl.textContent = '';

  supabase.auth.signInWithPassword({ email: email, password: pwd })
    .then(function (res) {
      btn.disabled = false; btn.textContent = '登入';
      if (res.error) {
        var msg = res.error.message;
        if (/Invalid login/i.test(msg)) msg = 'Email 或密碼錯誤';
        if (/Email not confirmed/i.test(msg)) msg = 'Email 尚未驗證，請先到信箱點確認信';
        errEl.textContent = msg;
        return;
      }
      showApp(res.data.user);
    })
    .catch(function (e) {
      btn.disabled = false; btn.textContent = '登入';
      errEl.textContent = '連線失敗：' + e.message;
    });
}
function doLogout() {
  supabase.auth.signOut().then(showLogin);
}

/* ============ 4. 分頁 ============ */
function switchTab(tab) {
  st.tab = tab;
  var navs = document.querySelectorAll('.nav-btn');
  for (var i = 0; i < navs.length; i++) navs[i].classList.toggle('active', navs[i].dataset.tab === tab);
  var tabs = document.querySelectorAll('.tab');
  for (var j = 0; j < tabs.length; j++) tabs[j].classList.toggle('active', tabs[j].id === 'tab-' + tab);
  if (tab === 'products') loadAdminProducts(true);
  if (tab === 'orders') loadOrders();
  if (tab === 'chat') { refreshChatSessionList(); markNavBadge(0); }
}

/* ============ 5. 商品 ============ */
var searchTimer = null;
function onAdminSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    st.prod.keyword = $('prodSearch').value.trim();
    loadAdminProducts(true);
  }, 380);
}

function loadAdminProducts(reset) {
  var p = st.prod;
  if (reset) p.page = 0;
  p.keyword = $('prodSearch').value.trim();
  p.cat = $('prodCat').value;
  p.status = $('prodStatus').value;

  $('productTableBody').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#777">載入中...</td></tr>';

  var q = supabase.from('products').select('*', { count: 'exact' });
  if (p.keyword) {
    var k = p.keyword.replace(/[,()%_\\]/g, '');
    if (k) q = q.or('name.ilike.%' + k + '%,brand.ilike.%' + k + '%');
  }
  if (p.cat) q = q.eq('category', p.cat);
  if (p.status !== '') q = q.eq('is_active', p.status === '1');

  var from = p.page * PAGE_SIZE;
  q.order('sort_order', { ascending: true })
   .order('created_at', { ascending: false })
   .range(from, from + PAGE_SIZE - 1)
   .then(function (res) {
     if (res.error) {
       $('productTableBody').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#ff4757">載入失敗：' + esc(res.error.message) + '</td></tr>';
       return;
     }
     p.rows = res.data || [];
     p.total = (res.count === null || res.count === undefined) ? p.rows.length : res.count;
     renderProductRows(p.rows);
     renderPager(p.page, p.total);
     $('prodInfo').textContent = '共 ' + p.total + ' 筆';
   });
}

function renderProductRows(rows) {
  var tb = $('productTableBody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:44px;color:#777">沒有符合的商品</td></tr>';
    return;
  }
  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var p = rows[i];
    var img = firstImage(p);
    html += '<tr>'
      + '<td>' + (img ? '<img src="' + esc(img) + '" class="t-thumb" loading="lazy" alt="">' : '<div class="t-thumb"></div>') + '</td>'
      + '<td class="t-name">' + esc(p.name) + '<div class="t-sub">ID ' + p.id + (p.name_i18n ? ' · 多語 ✓' : '') + '</div></td>'
      + '<td>' + esc(p.category || '—') + '</td>'
      + '<td>' + esc(p.brand || '—') + '</td>'
      + '<td>' + money(p.price_base) + '</td>'
      + '<td>' + (p.stock === null || p.stock === undefined ? '—' : num(p.stock)) + '</td>'
      + '<td><span class="pill ' + (p.is_active ? 'on' : 'off') + '">' + (p.is_active ? '上架' : '下架') + '</span></td>'
      + '<td><div class="row-actions">'
      + '<button class="icon-act" title="編輯" onclick="openProductModal(' + p.id + ')">✏️</button>'
      + '<button class="icon-act" title="複製" onclick="duplicateProduct(' + p.id + ')">⧉</button>'
      + '<button class="icon-act" title="上/下架" onclick="toggleProductActive(' + p.id + ',' + (p.is_active ? 'true' : 'false') + ')">' + (p.is_active ? '🔻' : '🔺') + '</button>'
      + '<button class="icon-act" title="刪除" onclick="deleteProduct(' + p.id + ')">🗑</button>'
      + '</div></td>'
      + '</tr>';
  }
  tb.innerHTML = html;
}

function renderPager(page, total) {
  var el = $('prodPager');
  var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (pages <= 1) { el.innerHTML = ''; return; }
  var html = '<button ' + (page === 0 ? 'disabled' : '') + ' onclick="goProdPage(' + (page - 1) + ')">上一頁</button>';
  var start = Math.max(0, page - 2), end = Math.min(pages - 1, start + 4);
  for (var i = start; i <= end; i++) {
    html += '<button class="' + (i === page ? 'active' : '') + '" onclick="goProdPage(' + i + ')">' + (i + 1) + '</button>';
  }
  html += '<button ' + (page >= pages - 1 ? 'disabled' : '') + ' onclick="goProdPage(' + (page + 1) + ')">下一頁</button>';
  html += '<span>第 ' + (page + 1) + ' / ' + pages + ' 頁</span>';
  el.innerHTML = html;
}

function goProdPage(n) {
  var pages = Math.max(1, Math.ceil(st.prod.total / PAGE_SIZE));
  if (n < 0 || n >= pages) return;
  st.prod.page = n;
  loadAdminProducts(false);
}

function loadCategories() {
  supabase.from('products').select('category').limit(1000).then(function (res) {
    var set = {}, list = [];
    (res.data || []).forEach(function (r) {
      if (r.category && !set[r.category]) { set[r.category] = 1; list.push(r.category); }
    });
    st.cats = list;
    var sel = $('prodCat');
    var html = '<option value="">全部分類</option>';
    list.forEach(function (c) { html += '<option value="' + esc(c) + '">' + esc(c) + '</option>'; });
    sel.innerHTML = html;
    var dl = $('catList');
    var dh = '';
    list.forEach(function (c) { dh += '<option value="' + esc(c) + '"></option>'; });
    dl.innerHTML = dh;
  });
}

function toggleProductActive(id, isActive) {
  supabase.from('products').update({ is_active: !isActive }).eq('id', id).then(function (res) {
    if (res.error) { toast('更新失敗：' + res.error.message, true); return; }
    toast(!isActive ? '已上架' : '已下架');
    loadAdminProducts(false);
  });
}

function deleteProduct(id) {
  if (!confirm('確定刪除這個商品？此動作無法復原。')) return;
  supabase.from('products').delete().eq('id', id).then(function (res) {
    if (res.error) { toast('刪除失敗：' + res.error.message, true); return; }
    toast('已刪除');
    loadAdminProducts(false);
    loadCategories();
  });
}

function duplicateProduct(id) {
  for (var i = 0; i < st.prod.rows.length; i++) {
    if (st.prod.rows[i].id === id) { openProductModal(null, st.prod.rows[i]); return; }
  }
}

function openProductModal(id, copyFrom) {
  var isEdit = !!id;
  var p = null;
  if (isEdit) {
    for (var i = 0; i < st.prod.rows.length; i++) if (st.prod.rows[i].id === id) p = st.prod.rows[i];
  }
  if (copyFrom) p = copyFrom;

  editingImages = p ? parseImages(p) : [];

  $('productModalTitle').textContent = isEdit ? '編輯商品' : (copyFrom ? '複製商品' : '新增商品');
  $('pId').value = isEdit ? p.id : '';
  $('pName').value = p ? (p.name || '') + (copyFrom && !isEdit ? '（複製）' : '') : '';
  $('pDesc').value = p ? (p.description || '') : '';
  $('pCategory').value = p ? (p.category || '') : '';
  $('pBrand').value = p ? (p.brand || '') : '';
  $('pBase').value = p ? num(p.price_base) : 0;
  $('pMid').value = p ? num(p.price_mid) : 0;
  $('pCustom').value = p ? num(p.price_custom) : 0;
  $('pStock').value = (p && p.stock !== null && p.stock !== undefined) ? num(p.stock) : 10;
  $('pSort').value = p ? num(p.sort_order) : 0;
  $('pActive').value = (p && p.is_active === false) ? '0' : '1';
  $('pNameI18n').value = (p && p.name_i18n) ? JSON.stringify(p.name_i18n) : '';
  $('pDescI18n').value = (p && p.desc_i18n) ? JSON.stringify(p.desc_i18n) : '';

  renderEditImages();
  openModal('productModal');
}

function renderEditImages() {
  var html = '';
  for (var i = 0; i < editingImages.length; i++) {
    html += '<div class="img-item"><img src="' + esc(editingImages[i]) + '" alt="">'
      + '<button type="button" title="移除" onclick="removeEditImage(' + i + ')">×</button></div>';
  }
  html += '<div class="img-add" title="上傳圖片" onclick="document.getElementById(\'pFileInput\').click()">＋</div>';
  $('pImages').innerHTML = html;
}

function removeEditImage(i) {
  editingImages.splice(i, 1);
  renderEditImages();
}

function onPickProductImages(input) {
  var files = Array.prototype.slice.call(input.files || []);
  input.value = '';
  if (!files.length) return;

  var chain = Promise.resolve();
  files.forEach(function (file) {
    chain = chain.then(function () {
      if (!file.type || file.type.indexOf('image/') !== 0) { toast('忽略非圖片：' + file.name, true); return; }
      if (file.size > 5 * 1024 * 1024) { toast('超過 5MB：' + file.name, true); return; }
      var ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      var path = 'products/' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
      return supabase.storage.from(BUCKET_PRODUCTS)
        .upload(path, file, { cacheControl: '3600', upsert: false, contentType: file.type })
        .then(function (res) {
          if (res.error) { toast('上傳失敗：' + res.error.message, true); return; }
          var pub = supabase.storage.from(BUCKET_PRODUCTS).getPublicUrl(path);
          editingImages.push(pub.data.publicUrl);
          renderEditImages();
        });
    });
  }).then(function () { toast('圖片處理完成'); });
}

function saveProduct() {
  var id = $('pId').value;
  var name = $('pName').value.trim();
  if (!name) { toast('請填寫商品名稱', true); return; }

  var nameI18n = null, descI18n = null;
  var niRaw = $('pNameI18n').value.trim();
  var diRaw = $('pDescI18n').value.trim();
  try {
    if (niRaw) nameI18n = JSON.parse(niRaw);
    if (diRaw) descI18n = JSON.parse(diRaw);
  } catch (e) {
    toast('多語 JSON 格式錯誤：' + e.message, true);
    return;
  }

  var payload = {
    name: name,
    description: $('pDesc').value.trim() || null,
    category: $('pCategory').value.trim() || null,
    brand: $('pBrand').value.trim() || null,
    price_base: num($('pBase').value),
    price_mid: num($('pMid').value),
    price_custom: num($('pCustom').value),
    images: editingImages,
    stock: num($('pStock').value),
    sort_order: num($('pSort').value),
    is_active: $('pActive').value === '1'
  };
  if (nameI18n) payload.name_i18n = nameI18n;
  if (descI18n) payload.desc_i18n = descI18n;

  var btn = $('saveProductBtn');
  btn.disabled = true; btn.textContent = '儲存中...';

  var req = id
    ? supabase.from('products').update(payload).eq('id', id)
    : supabase.from('products').insert([payload]);

  req.then(function (res) {
    btn.disabled = false; btn.textContent = '儲存';
    if (res.error) { toast('儲存失敗：' + res.error.message, true); return; }
    toast(id ? '已更新商品' : '已新增商品');
    closeProductModal();
    loadAdminProducts(false);
    loadCategories();
  });
}

function closeProductModal() { closeModal('productModal'); }

/* ============ 6. CSV ============ */
function openCsvModal() {
  $('csvResult').textContent = '';
  $('csvText').value = '';
  $('csvFile').value = '';
  openModal('csvModal');
}
function closeCsvModal() { closeModal('csvModal'); }

function onPickCsvFile(input) {
  var f = input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () { $('csvText').value = String(reader.result || ''); };
  reader.readAsText(f, 'utf-8');
}

function parseCsv(text) {
  var rows = [], row = [], field = '', inQuote = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQuote) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuote = false;
      } else field += c;
    } else {
      if (c === '"') inQuote = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.map(function (r) {
    return r.map(function (x) { return String(x).trim(); });
  }).filter(function (r) {
    return r.some(function (x) { return x !== ''; });
  });
}

function importCsv() {
  var text = $('csvText').value.trim();
  var btn = $('csvImportBtn');
  var resEl = $('csvResult');
  if (!text) { toast('請貼上或選擇 CSV 檔', true); return; }

  var rows = parseCsv(text);
  if (!rows.length) { toast('CSV 沒有資料', true); return; }
  if (rows[0][0] && /名稱|name/i.test(rows[0][0])) rows.shift();

  var records = rows.map(function (r) {
    var imgs = (r[5] || '').split('|').map(function (s) { return s.trim(); }).filter(Boolean);
    return {
      name: r[0] || '未命名商品',
      description: r[1] || null,
      category: r[2] || null,
      price_base: num(r[3]),
      price_mid: num(r[4]) || num(r[3]),
      price_custom: num(r[4]) || num(r[3]),
      images: imgs,
      stock: (r[6] === '' || r[6] === undefined) ? 10 : num(r[6]),
      is_active: true,
      sort_order: 0
    };
  });

  if (!records.length) { toast('沒有可匯入的資料', true); return; }

  btn.disabled = true;
  var ok = 0, fail = 0, i = 0;

  function next() {
    if (i >= records.length) {
      btn.disabled = false;
      resEl.textContent = '完成：成功 ' + ok + ' 筆' + (fail ? '，失敗 ' + fail + ' 筆' : '');
      toast('匯入完成：成功 ' + ok + ' 筆');
      loadAdminProducts(true);
      loadCategories();
      return;
    }
    var batch = records.slice(i, i + 100);
    i += batch.length;
    resEl.textContent = '匯入中 ' + Math.min(i, records.length) + ' / ' + records.length + ' ...';
    supabase.from('products').insert(batch).then(function (res) {
      if (res.error) { fail += batch.length; console.error(res.error); }
      else ok += batch.length;
      next();
    });
  }
  next();
}

/* ============ 7. 訂單 ============ */
function loadOrders() {
  var tb = $('ordersTableBody');
  tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#777">載入中...</td></tr>';

  var status = $('orderStatusFilter').value;
  var q = supabase.from('orders').select('*');
  if (status) q = q.eq('status', status);

  q.order('created_at', { ascending: false }).limit(200).then(function (res) {
    if (res.error) {
      tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#ff4757">載入失敗：' + esc(res.error.message) + '</td></tr>';
      return;
    }
    st.orders = res.data || [];
    st.orderSessionMap = {};
    st.orders.forEach(function (o) {
      if (o.session_id && !st.orderSessionMap[o.session_id]) {
        st.orderSessionMap[o.session_id] = { name: o.customer_name || '', phone: o.customer_phone || '' };
      }
    });

    if (!st.orders.length) {
      tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:44px;color:#777">目前沒有訂單</td></tr>';
      return;
    }

    var statusList = [['pending', '待處理'], ['confirmed', '已確認'], ['shipped', '已出貨'], ['done', '已完成'], ['cancelled', '已取消']];
    var html = '';

    st.orders.forEach(function (o) {
      var opts = '';
      statusList.forEach(function (s) {
        opts += '<option value="' + s[0] + '"' + (o.status === s[0] ? ' selected' : '') + '>' + s[1] + '</option>';
      });
      html += '<tr>'
        + '<td class="t-sub">' + esc(fmtDateTime(o.created_at)) + '</td>'
        + '<td>' + esc(o.customer_name || '—') + '</td>'
        + '<td>' + (o.customer_phone ? '<a href="tel:' + esc(o.customer_phone) + '">' + esc(o.customer_phone) + '</a>' : '—') + '</td>'
        + '<td class="t-name" title="' + esc(o.product_name || '') + '">' + esc((o.product_name || '—').slice(0, 26))
        + '<div class="t-sub">' + esc(o.customer_address || '') + '</div></td>'
        + '<td>' + money(o.total_amount) + '</td>'
        + '<td><select onchange="updateOrderStatus(' + o.id + ',this.value)" style="padding:6px 8px;border-radius:7px;border:1px solid #2a2a30;background:#111114;color:#e8e8ea;font-size:12px">' + opts + '</select></td>'
        + '<td><div class="row-actions">'
        + (o.session_id ? '<button class="icon-act" title="聯絡客戶" onclick="openCustomerChat(\'' + esc(o.session_id) + '\')">💬</button>' : '')
        + (o.customer_phone ? '<a class="icon-act" title="撥號" href="tel:' + esc(o.customer_phone) + '">📞</a>' : '')
        + '<button class="icon-act" title="複製" onclick="copyOrder(' + o.id + ')">📋</button>'
        + '<button class="icon-act" title="刪除" onclick="deleteOrder(' + o.id + ')">🗑</button>'
        + '</div></td></tr>';
    });
    tb.innerHTML = html;
  });
}

function updateOrderStatus(id, status) {
  supabase.from('orders').update({ status: status }).eq('id', id).then(function (res) {
    if (res.error) { toast('更新失敗：' + res.error.message, true); return; }
    toast('訂單狀態已更新');
  });
}

function copyOrder(id) {
  var o = null;
  st.orders.forEach(function (x) { if (x.id === id) o = x; });
  if (!o) return;
  var text = '【訂單 #' + o.id + '】\n客戶：' + o.customer_name + '\n電話：' + o.customer_phone +
    '\n地址：' + o.customer_address + '\n商品：' + o.product_name + '\n金額：' + money(o.total_amount) +
    '\n狀態：' + o.status + '\n時間：' + fmtDateTime(o.created_at);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function () { toast('已複製訂單資訊'); })
      .catch(function () { toast('複製失敗，請手動選取', true); });
  } else {
    toast('此瀏覽器不支援自動複製', true);
  }
}

function deleteOrder(id) {
  if (!confirm('確定刪除這筆訂單？')) return;
  supabase.from('orders').delete().eq('id', id).then(function (res) {
    if (res.error) { toast('刪除失敗：' + res.error.message, true); return; }
    toast('已刪除訂單');
    loadOrders();
  });
}

function openCustomerChat(sessionId) {
  switchTab('chat');
  setTimeout(function () { selectChatSession(sessionId); }, 60);
}

/* ============ 8. 聊天 ============ */
function markNavBadge(n) {
  var b = $('chatNavBadge');
  if (n > 0) { b.textContent = String(n); b.style.display = 'flex'; }
  else { b.textContent = '0'; b.style.display = 'none'; }
}

function refreshChatSessionList() {
  supabase.from('chat_messages')
    .select('session_id,sender,message,msg_type,created_at')
    .order('created_at', { ascending: false })
    .limit(400)
    .then(function (res) {
      if (res.error) { console.error(res.error); return; }
      (res.data || []).forEach(function (m) {
        var sid = m.session_id;
        if (!sid) return;
        if (!allChatSessions[sid]) allChatSessions[sid] = { lastMessage: '', lastTime: new Date(0), unread: 0 };
        var s = allChatSessions[sid];
        var t = new Date(m.created_at || Date.now());
        if (t > s.lastTime) {
          s.lastTime = t;
          s.lastMessage = m.msg_type === 'image' ? '[圖片]' : (m.msg_type === 'video' ? '[影片]' : (m.message || ''));
        }
      });
      Object.keys(st.orderSessionMap || {}).forEach(function (sid) {
        if (!allChatSessions[sid]) allChatSessions[sid] = { lastMessage: '（尚無訊息）', lastTime: new Date(0), unread: 0 };
      });
      renderChatSessionList();
    });
}

function sessionLabel(sid) {
  var o = st.orderSessionMap[sid];
  if (o && (o.name || o.phone)) return (o.name || '客戶') + (o.phone ? ' ' + o.phone : '');
  return '訪客 ' + sid.slice(0, 8);
}

function renderChatSessionList() {
  var box = $('chatSessionList');
  var list = Object.keys(allChatSessions).map(function (sid) {
    var s = allChatSessions[sid];
    return { sid: sid, lastMessage: s.lastMessage, lastTime: s.lastTime, unread: s.unread || 0 };
  }).sort(function (a, b) { return new Date(b.lastTime) - new Date(a.lastTime); });

  if (!list.length) {
    box.innerHTML = '<div class="chat-empty" style="margin-top:30px">目前沒有對話</div>';
    return;
  }

  var html = '';
  list.forEach(function (s) {
    html += '<div class="session-item' + (s.sid === currentChatSession ? ' active' : '') + '" onclick="selectChatSession(\'' + esc(s.sid) + '\')">'
      + '<div class="session-name"><span>' + esc(sessionLabel(s.sid))
      + (s.unread ? '<span class="session-unread">' + s.unread + '</span>' : '') + '</span>'
      + '<span class="session-time">' + (s.lastTime && s.lastTime.getTime() > 0 ? esc(fmtTime(s.lastTime)) : '') + '</span></div>'
      + '<div class="session-last">' + esc(s.lastMessage || '') + '</div></div>';
  });
  box.innerHTML = html;
}

function selectChatSession(sessionId) {
  currentChatSession = sessionId;
  if (allChatSessions[sessionId]) allChatSessions[sessionId].unread = 0;
  renderChatSessionList();

  $('admin-chat-header').innerText = '正在與 ' + sessionLabel(sessionId) + ' 對話';
  $('admin-chat-session-label').innerText = 'Session: ' + sessionId;
  $('admin-chat-input').disabled = false;
  $('admin-chat-send-btn').disabled = false;
  $('admin-chat-img-btn').disabled = false;

  var body = $('admin-chat-body');
  body.innerHTML = '<div class="chat-empty">載入中...</div>';

  supabase.from('chat_messages').select('*').eq('session_id', sessionId)
    .order('created_at', { ascending: true })
    .then(function (res) {
      if (res.error) {
        body.innerHTML = '<div class="chat-empty" style="color:#ff4757">載入失敗：' + esc(res.error.message) + '</div>';
        return;
      }
      body.innerHTML = '';
      if (!res.data || !res.data.length) {
        body.innerHTML = '<div class="chat-empty">此訪客尚無訊息</div>';
        return;
      }
      res.data.forEach(function (m) {
        appendAdminChatMessage(m.message, m.sender, m.created_at, m.image_url, m.msg_type);
      });
    });
}

function openImageLightbox(url) {
  $('lightboxImg').src = url;
  $('imageLightbox').classList.add('active');
}
function closeImageLightbox() {
  $('imageLightbox').classList.remove('active');
  setTimeout(function () { $('lightboxImg').src = ''; }, 250);
}

function appendAdminChatMessage(text, sender, createdAt, mediaUrl, msgType) {
  var body = $('admin-chat-body');
  var empty = body.querySelector('.chat-empty');
  if (empty) empty.remove();

  var div = document.createElement('div');
  div.className = 'chat-msg ' + (sender === 'admin' ? 'admin' : 'user');
  var timeStr = createdAt ? fmtTime(createdAt) : '';

  if (msgType === 'image' && mediaUrl) {
    var img = document.createElement('img');
    img.className = 'chat-img';
    img.src = mediaUrl;
    img.alt = '圖片';
    img.onclick = function () { openImageLightbox(this.src); };
    img.onerror = function () {
      var tip = document.createElement('div');
      tip.style.color = '#ff4757';
      tip.style.fontSize = '12px';
      tip.textContent = '⚠️ 圖片載入失敗';
      div.insertBefore(tip, div.firstChild);
      img.remove();
    };
    div.appendChild(img);
  } else if (msgType === 'video' && mediaUrl) {
    var video = document.createElement('video');
    video.className = 'chat-video';
    video.src = mediaUrl;
    video.controls = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('preload', 'metadata');
    div.appendChild(video);
  } else {
    div.appendChild(document.createTextNode(text || ''));
  }

  var t = document.createElement('div');
  t.className = 'chat-msg-time';
  t.textContent = timeStr;
  div.appendChild(t);

  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function sendAdminReply() {
  var input = $('admin-chat-input');
  var text = input.value.trim();
  if (!text) return;
  if (!currentChatSession) { toast('請先選擇對話', true); return; }

  input.value = '';

  supabase.from('chat_messages').insert([{
    session_id: currentChatSession,
    sender: 'admin',
    message: text,
    msg_type: 'text'
  }]).then(function (res) {
    if (res.error) { alert('送出失敗：' + res.error.message); input.value = text; return; }
    appendAdminChatMessage(text, 'admin', new Date().toISOString(), null, 'text');
    if (!allChatSessions[currentChatSession]) allChatSessions[currentChatSession] = { lastMessage: '', lastTime: new Date(), unread: 0 };
    allChatSessions[currentChatSession].lastMessage = text;
    allChatSessions[currentChatSession].lastTime = new Date();
    renderChatSessionList();
  });
}

function handleAdminChatImage(inputEl) {
  if (!currentChatSession) { toast('請先選擇對話', true); return; }

  var file = inputEl.files[0];
  inputEl.value = '';
  if (!file) return;
  if (!file.type || file.type.indexOf('image/') !== 0) { alert('請選擇圖片檔'); return; }
  if (file.size > 5 * 1024 * 1024) { alert('圖片大小請小於 5MB'); return; }

  var ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  var path = currentChatSession + '/' + Date.now() + '_admin.' + ext;

  var body = $('admin-chat-body');
  var loading = document.createElement('div');
  loading.className = 'chat-msg admin';
  loading.textContent = '📤 圖片上傳中...';
  body.appendChild(loading);
  body.scrollTop = body.scrollHeight;

  supabase.storage.from(BUCKET_CHAT)
    .upload(path, file, { cacheControl: '3600', upsert: false, contentType: file.type || 'image/jpeg' })
    .then(function (up) {
      if (up.error) { loading.remove(); alert('圖片上傳失敗：' + up.error.message); return; }

      var pub = supabase.storage.from(BUCKET_CHAT).getPublicUrl(path);
      var url = pub.data.publicUrl;

      supabase.from('chat_messages').insert([{
        session_id: currentChatSession,
        sender: 'admin',
        message: '[圖片]',
        image_url: url,
        msg_type: 'image'
      }]).then(function (res) {
        loading.remove();
        if (res.error) { alert('訊息送出失敗：' + res.error.message); return; }
        appendAdminChatMessage('[圖片]', 'admin', new Date().toISOString(), url, 'image');
        if (!allChatSessions[currentChatSession]) allChatSessions[currentChatSession] = { lastMessage: '', lastTime: new Date(), unread: 0 };
        allChatSessions[currentChatSession].lastMessage = '[圖片]';
        allChatSessions[currentChatSession].lastTime = new Date();
        renderChatSessionList();
      });
    });
}

function initChatRealtime() {
  if (chatChannel) return;
  chatChannel = supabase.channel('admin-chat-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, function (payload) {
      var msg = payload.new;
      if (!msg || !msg.session_id) return;
      var sid = msg.session_id;

      if (!allChatSessions[sid]) allChatSessions[sid] = { lastMessage: '', lastTime: new Date(0), unread: 0 };
      var s = allChatSessions[sid];
      s.lastMessage = msg.msg_type === 'image' ? '[圖片]' : (msg.msg_type === 'video' ? '[影片]' : (msg.message || ''));
      s.lastTime = new Date(msg.created_at || Date.now());

      if (sid === currentChatSession) {
        appendAdminChatMessage(msg.message, msg.sender, msg.created_at, msg.image_url, msg.msg_type);
      } else if (msg.sender === 'user') {
        s.unread = (s.unread || 0) + 1;
        var total = 0;
        Object.keys(allChatSessions).forEach(function (k) { total += allChatSessions[k].unread || 0; });
        markNavBadge(total);
        if (st.tab !== 'chat') toast('新訊息：' + sessionLabel(sid));
      }
      renderChatSessionList();
    })
    .subscribe();
}

/* 每 30 秒保險刷新對話列表 */
setInterval(function () {
  if ($('app').style.display !== 'none' && st.tab === 'chat') refreshChatSessionList();
}, 30000);

/* ============ 9. 啟動 ============ */
(function boot() {
  supabase.auth.getSession().then(function (res) {
    if (res.data && res.data.session) showApp(res.data.session.user);
    else showLogin();
  });
  supabase.auth.onAuthStateChange(function (_e, session) {
    if (session) showApp(session.user);
    else showLogin();
  });
})();
</script>
