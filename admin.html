<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台 - 登入</title>
    <style>
        body { background-color: #111; color: #fff; font-family: 'Microsoft JhengHei', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #login-screen { background: #222; padding: 40px; border-radius: 15px; border: 2px solid #d4af37; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 300px; }
        #login-screen h2 { color: #d4af37; margin-top: 0; }
        #login-screen input { width: 100%; padding: 12px; margin: 15px 0; box-sizing: border-box; border: 1px solid #555; border-radius: 5px; background: #333; color: #fff; font-size: 16px; text-align: center; }
        #login-screen button { width: 100%; padding: 12px; background: #d4af37; color: #000; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #login-screen button:hover { background: #fcf6ba; }
        .error-msg { color: #ff4757; font-size: 14px; height: 20px; margin-top: 10px; }
        #admin-panel { display: none; text-align: center; }
        .box { background: #222; padding: 40px; border-radius: 15px; border: 2px solid #d4af37; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .box h1 { color: #d4af37; margin-top: 0; }
        .number { font-size: 80px; font-weight: bold; color: #00c800; margin: 20px 0; text-shadow: 0 0 20px rgba(0, 200, 0, 0.5); }
        .status { font-size: 14px; color: #888; }
        .logout-btn { margin-top: 20px; padding: 8px 15px; background: transparent; color: #888; border: 1px solid #888; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .logout-btn:hover { color: #fff; border-color: #fff; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>👑 管理員登入</h2>
        <p style="font-size: 13px; color: #aaa;">請輸入專屬密碼以查看即時人流</p>
        <input type="password" id="password-input" placeholder="請輸入密碼">
        <button onclick="checkPassword()">登入</button>
        <div class="error-msg" id="error-msg"></div>
    </div>

    <div id="admin-panel">
        <div class="box">
            <h1>👑 專屬管理後台</h1>
            <div>目前真實線上人數</div>
            <div class="number" id="online-count">--</div>
            <div class="status" id="status-text">正在連線至資料庫...</div>
            
            <!-- 🌟 訪客狀態列表 -->
            <div style="margin-top: 20px; text-align: left; font-size: 13px; color: #aaa; max-height: 180px; overflow-y: auto; background: #111; padding: 12px; border-radius: 8px; border: 1px solid #333;">
                <div style="color: #d4af37; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 5px;">👥 即時訪客狀態：</div>
                <ul id="visitor-list" style="list-style: none; padding: 0; margin: 0; line-height: 1.8;">
                    <!-- 訪客資料會動態插入這裡 -->
                </ul>
            </div>

            <button class="logout-btn" onclick="logout()">登出</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'adnim'; 

        const GITHUB_USER = 'seiko231';
        const GITHUB_REPO = 'live-counter-data';
        const GITHUB_TOKEN = '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'; // 👈 這裡也換成同一把金鑰
        const FILE_PATH = 'online.json';

        let fetchInterval = null;

        window.onload = function() {
            if (localStorage.getItem('admin_logged_in') === 'true') { showAdminPanel(); }
        };

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === ADMIN_PASSWORD) {
                localStorage.setItem('admin_logged_in', 'true');
                showAdminPanel();
            } else {
                document.getElementById('error-msg').innerText = '密碼錯誤，請重新輸入！';
            }
        }

        function showAdminPanel() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            fetchOnlineCount(); 
            fetchInterval = setInterval(fetchOnlineCount, 5000); 
        }

        function logout() {
            localStorage.removeItem('admin_logged_in');
            location.reload();
        }

        async function fetchOnlineCount() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                const data = await res.json();
                
                if (!data.content) {
                    document.getElementById('status-text').innerText = "GitHub 錯誤: " + data.message;
                    return;
                }

                const content = JSON.parse(atob(data.content));
                const now = Date.now();
                let activeCount = 0;
                
                const visitorList = document.getElementById('visitor-list');
                visitorList.innerHTML = '';

                for (let id in content) {
                    if (now - content[id].time < 60000) { 
                        activeCount++;
                        
                        const timeDiff = now - content[id].time;
                        const mins = Math.floor(timeDiff / 60000);
                        const secs = Math.floor((timeDiff % 60000) / 1000);
                        let timeText = "";
                        if (mins > 0) timeText = `已停留 ${mins} 分 ${secs} 秒`;
                        else timeText = `剛進入 ${secs} 秒`;

                        const li = document.createElement('li');
                        li.innerHTML = `🟢 ${content[id].device} <span style="color:#888; font-size:11px;">(${timeText})</span>`;
                        visitorList.appendChild(li);
                    }
                }

                document.getElementById('online-count').innerText = activeCount;
                document.getElementById('status-text').innerText = `最後更新時間：${new Date().toLocaleTimeString()}`;
            } catch (error) {
                document.getElementById('status-text').innerText = "程式錯誤: " + error.message;
            }
        }
    </script>
</body>
</html>
