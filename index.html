<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尊享腕錶盲盒</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #d4af37;
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            max-width: 800px;
            width: 100%;
        }
        .box {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 1px solid #333;
            border-radius: 10px;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #d4af37;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            overflow: hidden; 
        }
        .box:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .box.opened {
            background-color: #1a1a1a;
            border-color: #222;
            cursor: default;
            transform: none;
            box-shadow: none;
            padding: 0; 
        }
        
        /* 當遊戲結束時，沒被點開的格子會變暗 */
        .box.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* --- 彈出視窗表單樣式 --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #d4af37;
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-content h2 {
            color: #d4af37;
            margin-top: 0;
            font-size: 22px;
        }
        .modal-content img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #333;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        .modal-content input:focus {
            outline: none;
            border-color: #d4af37;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-content button:hover {
            background-color: #f1c40f;
        }
        .modal-content button:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .box { font-size: 18px; }
        }
    </style>
</head>
<body>

    <h1>✨ 尊享腕錶盲盒 ✨</h1>
    <p>請點擊下方任一數字，開啟您的專屬幸運<br><span style="color: #e74c3c;">(每人限抽一次，選定後不可更改)</span></p>

    <div class="grid-container" id="blindbox-grid"></div>

    <!-- 彈出視窗與表單 -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h2>🎉 恭喜中獎！</h2>
            <div id="resultImageContainer"></div>
            <p style="margin-bottom: 20px; font-size: 14px; color: #ccc;">請填寫您的聯絡資訊，以便為您寄出獎品。</p>
            <form id="shippingForm">
                <input type="text" id="custName" placeholder="請輸入姓名" required>
                <input type="tel" id="custPhone" placeholder="請輸入電話號碼" required>
                <input type="text" id="custAddress" placeholder="請輸入收件地址" required>
                <button type="submit">確認送出</button>
            </form>
        </div>
    </div>

    <script>
        const grid = document.getElementById('blindbox-grid');
        const modal = document.getElementById('infoModal');
        const closeBtn = document.getElementById('closeModalBtn');
        const form = document.getElementById('shippingForm');
        const resultImgContainer = document.getElementById('resultImageContainer');

        // ✅ 已填入你的接收信箱
        const yourEmail = 'c17872822528@163.com'; 

        // 手錶名稱對照表 (如果信件裡想顯示特定名稱，可以改這裡)
        const watchNames = {
            1: "1號手錶", 2: "2號手錶", 3: "3號手錶", 4: "4號手錶", 5: "5號手錶", 6: "6號手錶",
            7: "7號手錶", 8: "8號手錶", 9: "9號手錶", 10: "10號手錶", 11: "11號手錶", 12: "12號手錶",
            13: "13號手錶", 14: "14號手錶", 15: "15號手錶", 16: "16號手錶", 17: "17號手錶", 18: "18號手錶",
            19: "19號手錶", 20: "20號手錶", 21: "21號手錶", 22: "22號手錶", 23: "23號手錶", 24: "24號手錶",
            25: "25號手錶", 26: "26號手錶", 27: "27號手錶", 28: "28號手錶", 29: "29號手錶", 30: "30號手錶",
            31: "31號手錶", 32: "32號手錶", 33: "33號手錶", 34: "34號手錶", 35: "35號手錶", 36: "36號手錶"
        };

        // 洗牌圖片池
        let imagePool = Array.from({length: 36}, (_, i) => i + 1); 
        for (let i = imagePool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [imagePool[i], imagePool[j]] = [imagePool[j], imagePool[i]];
        }

        let currentSelectedImage = ''; 
        let hasDrawn = false; 

        // 渲染格子
        for (let index = 0; index < 36; index++) {
            const box = document.createElement('div');
            box.className = 'box';
            const displayNumber = index + 1;
            box.innerText = displayNumber;
            
            const randomImageNumber = imagePool[index];
            
            box.addEventListener('click', function() {
                if (hasDrawn) {
                    alert("您已經抽過盲盒囉！每人限抽一次。");
                    return;
                }

                if (!this.classList.contains('opened')) {
                    hasDrawn = true; 
                    this.classList.add('opened');
                    currentSelectedImage = randomImageNumber;
                    
                    this.innerHTML = `<img src="images/${randomImageNumber}.webp" style="width: 100%; height: 100%; object-fit: cover;">`;
                    
                    const allBoxes = document.querySelectorAll('.box');
                    allBoxes.forEach(b => {
                        if (!b.classList.contains('opened')) {
                            b.classList.add('disabled');
                        }
                    });

                    setTimeout(() => {
                        openModal(randomImageNumber, displayNumber);
                    }, 500);
                }
            });
            
            grid.appendChild(box);
        }

        function openModal(imgNum, boxNum) {
            resultImgContainer.innerHTML = `<img src="images/${imgNum}.webp">`;
            modal.style.display = 'flex';
            form.dataset.boxNum = boxNum; 
        }

        closeBtn.onclick = function() {
            modal.style.display = 'none';
        }
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // 處理表單送出
        form.addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const boxNum = this.dataset.boxNum;
            const submitBtn = this.querySelector('button[type="submit"]');
            
            const watchName = watchNames[currentSelectedImage] || `${currentSelectedImage}號手錶`;
            
            submitBtn.innerText = '傳送中...';
            submitBtn.disabled = true;

            // 呼叫 FormSubmit API
            fetch(`https://formsubmit.co/ajax/${yourEmail}`, {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    客戶姓名: name,
                    客戶電話: phone,
                    收件地址: address,
                    "抽中的格子": `第 ${boxNum} 格`,
                    "抽中的手錶款式": watchName,
                    "手錶圖片檔名": `${currentSelectedImage}.webp`,
                    _subject: `【盲盒中獎通知】客戶 ${name} 抽中了 ${watchName}！`
                })
            })
            .then(response => response.json())
            .then(data => {
                alert(`✅ 送出成功！\n${name} 您好，我們已收到您的資訊，將盡快為您安排寄送！`);
                modal.style.display = 'none';
                form.reset();
                submitBtn.innerText = '確認送出';
                submitBtn.disabled = false;
            })
            .catch(error => {
                alert("⚠️ 網路連線錯誤，請稍後再試一次。");
                submitBtn.innerText = '確認送出';
                submitBtn.disabled = false;
            });
        });
    </script>

</body>
</html>
