        }

        .product-card {
            background: linear-gradient(145deg, rgba(30,30,30,0.8), rgba(15,15,15,0.9));

        function openModal(imgNum) {
            modal.classList.add('active'); 
            document.getElementById('shippingForm').dataset.imgNum = imgNum;
        }

        closeBtn.onclick = function() { modal.classList.remove('active'); }
        window.onclick = function(event) { if (event.target == modal) modal.classList.remove('active'); }

        function openLightbox(imagesArray) {
            galleryTrack.innerHTML = '';
            imagesArray.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.onerror = function() { this.src = 'https://via.placeholder.com/800x600?text=Image+Not+Found'; };
                galleryTrack.appendChild(img);
            });
            lightbox.classList.add('active');
            galleryTrack.scrollLeft = 0; 
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        lightbox.onclick = function(event) { 
            if (event.target === lightbox || event.target.classList.contains('gallery-track')) {
                closeLightbox();
            }
        }

        submitBtn.addEventListener('click', function() {
            const form = document.getElementById('shippingForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const imgNum = form.dataset.imgNum;
            const watch = watchData[imgNum];

            submitBtn.innerText = '處理中...';
            submitBtn.disabled = true;

            fetch(`https://formsubmit.co/ajax/${yourEmail}`, {
                method: "POST",
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    客戶姓名: name, 
                    客戶電話: phone, 
                    收件地址: address,
                    "預約商品": `${watch.name} (編號 ${imgNum})`,
                    _subject: `【新訂單】客戶 ${name} 預約了 ${watch.name}`
                })
            }).catch(err => console.log('Mail error:', err));

            setTimeout(() => {
                alert(`✅ 已收到您的資料！\n\n接下來將為您跳轉至 LINE，請加入好友並回傳一個「貼圖」，讓我們知道您是哪位，以便為您安排貨到付款。`);
                window.location.href = lineUrl;
            }, 600);
        });
    </script>
</body>
</html>
