<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尊享腕錶盲盒</title>
    <style>
        /* 🌟 基礎與背景設定 */
        :root { --gold: #d4af37; --bg-dark: #0f0f0f; }
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 15% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            color: #ffffff; font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 🌟 標題與說明 */
        .header-section { text-align: center; margin-bottom: 20px; width: 100%; max-width: 800px; }
        h1 {
            color: var(--gold); font-size: 38px; margin-bottom: 10px;
            letter-spacing: 5px; text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            font-weight: 800;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #bbb; font-size: 16px; margin-bottom: 15px; letter-spacing: 2px; }
        
        /* 🌟 首頁 LINE 聯絡區塊 */
        .line-contact-banner {
            background: linear-gradient(145deg, rgba(30,30,30,0.9), rgba(15,15,15,0.9));
            border: 2px solid var(--gold); border-radius: 15px;
            padding: 15px 20px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(212, 175, 55, 0.2);
            text-align: left;
        }
        .line-contact-banner img {
            width: 100px; height: 100px; border-radius: 10px; border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(0, 200, 0, 0.4); cursor: zoom-in; transition: transform 0.2s;
        }
        .line-contact-banner img:hover { transform: scale(1.05); }
        .line-text h3 { color: var(--gold); margin: 0 0 8px 0; font-size: 18px; }
        .line-text p { color: #ddd; margin: 0; font-size: 13px; line-height: 1.5; }
        .line-text p span { color: #ff4757; font-weight: bold; }

        .legal-notice {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px; padding: 12px 20px; font-size: 13px; color: #999;
            margin: 0 auto 20px auto; line-height: 1.6; text-align: left;
        }
        .legal-notice strong { color: var(--gold); }

        /* 🌟 盲盒格子區 */
        .grid-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; width: 100%; max-width: 800px; }
        .box {
            background: linear-gradient(145deg, rgba(40,40,40,0.8), rgba(20,20,20,0.9));
            backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; aspect-ratio: 1 / 1; display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; color: var(--gold); cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1); overflow: hidden; position: relative;
        }
        .box:hover:not(.opened):not(.disabled) { transform: translateY(-8px) scale(1.05); border-color: rgba(212, 175, 55, 0.6); color: #fff; }
        .box.opened { background-color: #000; border-color: var(--gold); cursor: pointer; transform: scale(1.1); z-index: 2; box-shadow: 0 0 25px rgba(212, 175, 55, 0.8); padding: 0; }
        .box.opened:hover { transform: scale(1.15); }
        .box.disabled { opacity: 0.15; cursor: not-allowed; transform: scale(0.95); border-color: transparent; box-shadow: none; filter: grayscale(100%); pointer-events: none; }

        /* 🌟 彈出視窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: center; z-index: 999; opacity: 0; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: linear-gradient(160deg, rgba(40,40,40,0.95) 0%, rgba(15,15,15,0.95) 100%);
            padding: 30px 25px; border-radius: 24px; border: 1px solid rgba(212, 175, 55, 0.3);
            width: 92%; max-width: 480px; text-align: center; position: relative;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9); max-height: 90vh; overflow-y: auto;
            transform: translateY(30px) scale(0.95); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        
        .modal-content h2 { color: var(--gold); margin-top: 0; font-size: 28px; margin-bottom: 20px; }
        .image-gallery { display: flex; justify-content: center; margin-bottom: 20px; }
        .image-gallery img {
            height: 260px; width: auto; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
            object-fit: cover; cursor: zoom-in; transition: 0.3s;
        }
        .image-gallery img:hover { border-color: var(--gold); transform: scale(1.02); }

        /* 🌟 彈出視窗內的 LINE 提醒 */
        .modal-line-banner {
            background: rgba(0, 200, 0, 0.1); border: 1px dashed #00c800; border-radius: 10px;
            padding: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; text-align: left;
        }
        .modal-line-banner img { width: 60px; height: 60px; border-radius: 8px; background: #fff; padding: 3px; cursor: zoom-in; }
        .modal-line-banner .text h4 { color: #00c800; margin: 0 0 5px 0; font-size: 16px; }
        .modal-line-banner .text p { color: #ccc; margin: 0; font-size: 13px; line-height: 1.5; }
        .modal-line-banner .text p span { color: #ff4757; font-weight: bold; }

        .form-divider { display: flex; align-items: center; text-align: center; color: var(--gold); font-size: 15px; font-weight: bold; margin: 20px 0; }
        .form-divider::before, .form-divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
        .form-divider::before { margin-right: 15px; } .form-divider::after { margin-left: 15px; }

        .modal-content input {
            width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; background: rgba(255,255,255,0.03); color: #fff; box-sizing: border-box; font-size: 15px;
        }
        .modal-content input:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.06); }
        .modal-content input::placeholder { color: #666; }
        
        .privacy-notice { font-size: 12px; color: #777; text-align: left; margin-bottom: 20px; line-height: 1.5; }

        /* 🌟 送出按鈕 */
        .submit-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(90deg, #00c800, #00e600, #00c800); /* 改成綠色，代表 LINE */
            background-size: 200% auto; color: #fff; border: none; border-radius: 10px;
            font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.5s;
            box-shadow: 0 10px 20px rgba(0, 200, 0, 0.3); letter-spacing: 1px;
        }
        .submit-btn:hover { background-position: right center; transform: translateY(-2px); }

        .close-btn { position: absolute; top: 15px; right: 20px; color: #888; font-size: 30px; cursor: pointer; }
        .close-btn:hover { color: #fff; }

        /* 🌟 全螢幕放大圖片 */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; cursor: zoom-out; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; }

        @media (max-width: 600px) {
            h1 { font-size: 28px; }
            .grid-container { grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .box { font-size: 20px; }
            .line-contact-banner { flex-direction: column; text-align: center; gap: 10px; }
            .line-contact-banner img { width: 120px; height: 120px; }
            .modal-line-banner { flex-direction: column; text-align: center; }
            .modal-content { padding: 20px 15px; width: 95%; }
            .image-gallery img { height: 220px; }
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>尊享腕錶盲盒</h1>
        <div class="subtitle">點擊下方任一數字，開啟您的專屬驚喜</div>
        
        <div class="line-contact-banner">
            <img src="images/line-qr.jpg" alt="LINE QR Code" onclick="openLightbox('images/line-qr.jpg')" onerror="this.src='https://via.placeholder.com/100x100?text=QR+Code'">
            <div class="line-text">
                <h3>📱 請加 LINE 聯絡 (點圖放大)</h3>
                <p><span>一律按貨到付款</span>，出貨後會把單號發送給您！</p>
            </div>
        </div>

        <div class="legal-notice">
            <strong>【活動說明】</strong><br>
            本盲盒活動包含 36 款精選腕錶。每人限抽一次，選定後不可更改或退換。
        </div>
    </div>

    <!-- 盲盒區塊 -->
    <div class="grid-container" id="blindbox-grid"></div>

    <!-- 彈出視窗 -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h2>🎉 恭喜您抽中！</h2>
            
            <div class="image-gallery" id="galleryContainer"></div>

            <div class="modal-line-banner">
                <img src="images/line-qr.jpg" alt="LINE QR Code" onclick="openLightbox('images/line-qr.jpg')" onerror="this.src='https://via.placeholder.com/80x80?text=QR+Code'">
                <div class="text">
                    <h4>⚠️ 填寫後請跳轉 LINE 傳送資料</h4>
                    <p>點擊下方按鈕後，系統會<b>自動複製您的資料</b>並跳轉 LINE，請將資料貼上發送給我們才算完成！</p>
                </div>
            </div>

            <div class="form-divider">填寫收件資訊</div>

            <form id="shippingForm" onsubmit="event.preventDefault();">
                <input type="text" id="custName" placeholder="請輸入收件人姓名" required>
                <input type="tel" id="custPhone" placeholder="請輸入聯絡電話" required>
                <input type="text" id="custAddress" placeholder="請輸入詳細收件地址" required>
                
                <div class="privacy-notice">
                    <strong>個人資料保護聲明：</strong>本表單收集之資料，僅限用於本次活動之獎品寄送與聯繫。
                </div>

                <button type="button" class="submit-btn" id="submitBtn">一鍵複製並加 LINE 領取</button>
            </form>
        </div>
    </div>

    <!-- 全螢幕看圖 -->
    <div class="lightbox" id="lightbox">
        <img id="lightboxImg" src="" alt="放大圖片">
    </div>

    <script>
        const grid = document.getElementById('blindbox-grid');
        const modal = document.getElementById('infoModal');
        const closeBtn = document.getElementById('closeModalBtn');
        const galleryContainer = document.getElementById('galleryContainer');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const submitBtn = document.getElementById('submitBtn');

        // ✅ 已替換成你的 LINE 連結
        const lineUrl = 'https://line.me/ti/p/vCEhGhnT9Z'; 

        // 洗牌圖片池
        let imagePool = Array.from({length: 36}, (_, i) => i + 1); 
        for (let i = imagePool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [imagePool[i], imagePool[j]] = [imagePool[j], imagePool[i]];
        }

        let currentSelectedImage = ''; 
        let currentSelectedBoxNum = 0;
        let hasDrawn = false; 

        // 生成格子
        for (let index = 0; index < 36; index++) {
            const box = document.createElement('div');
            box.className = 'box';
            box.innerText = index + 1; 
            
            const randomImageNumber = imagePool[index];
            
            box.addEventListener('click', function() {
                if (hasDrawn) {
                    if (this.classList.contains('opened')) {
                        openModal(currentSelectedImage, currentSelectedBoxNum);
                    } else {
                        alert("您已經抽過盲盒囉！請點擊您抽中的號碼完成領取。");
                    }
                    return;
                }

                if (!this.classList.contains('opened')) {
                    hasDrawn = true; 
                    this.classList.add('opened');
                    
                    currentSelectedImage = randomImageNumber;
                    currentSelectedBoxNum = index + 1;
                    
                    this.innerHTML = `<img src="images/${randomImageNumber}.webp" style="width: 100%; height: 100%; object-fit: cover;">`;
                    
                    document.querySelectorAll('.box').forEach(b => {
                        if (!b.classList.contains('opened')) b.classList.add('disabled');
                    });
                    
                    setTimeout(() => openModal(currentSelectedImage, currentSelectedBoxNum), 400);
                }
            });
            grid.appendChild(box);
        }

        function openModal(imgNum, boxNum) {
            const imgSrc = `images/${imgNum}.webp`;
            galleryContainer.innerHTML = `<img src="${imgSrc}" onclick="openLightbox('${imgSrc}')" onerror="this.src='https://via.placeholder.com/400x400?text=Image+Not+Found'">`;
            
            modal.classList.add('active'); 
            form.dataset.boxNum = boxNum; 
            form.dataset.imgNum = imgNum;
        }

        closeBtn.onclick = function() { modal.classList.remove('active'); }
        window.onclick = function(event) { if (event.target == modal) modal.classList.remove('active'); }

        function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add('active'); }
        lightbox.onclick = function() { lightbox.classList.remove('active'); }

        // 🌟 核心優化：點擊按鈕後，複製資料並跳轉 LINE
        submitBtn.addEventListener('click', function() {
            const form = document.getElementById('shippingForm');
            
            // 1. 檢查必填欄位
            if (!form.checkValidity()) {
                form.reportValidity(); 
                return;
            }

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const boxNum = form.dataset.boxNum; 
            const imgNum = form.dataset.imgNum;

            // 2. 組合要傳給你的文字內容
            const messageText = `【盲盒領獎資料】\n姓名：${name}\n電話：${phone}\n地址：${address}\n抽中格子：第 ${boxNum} 格\n手錶編號：${imgNum}.webp`;

            // 3. 自動複製到剪貼簿
            navigator.clipboard.writeText(messageText).then(() => {
                // 複製成功後，跳出提示
                alert(`✅ 資料已複製！\n\n接下來將為您跳轉至 LINE，請在 LINE 聊天室中「長按貼上」並發送，我們收到後才算完成登記喔！`);
                
                // 4. 跳轉到 LINE
                window.location.href = lineUrl;
            }).catch(err => {
                // 如果複製失敗（有些舊手機不支援），跳出警告讓他手動複製
                alert(`⚠️ 無法自動複製，請手動記下您的資料：\n\n${messageText}\n\n接下來將跳轉至 LINE，請將資料傳送給我們。`);
                window.location.href = lineUrl;
            });
        });
    </script>
</body>
</html>
